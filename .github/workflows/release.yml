name: Release

# Publishes the package to npm with build provenance. Provenance requires an
# OIDC-authenticated publish from CI (id-token: write) — a plain `npm publish`
# cannot produce it, which is why `publishConfig.provenance: true` in
# package.json only works through this workflow.
#
# Trigger: cut a GitHub Release (its tag should match package.json version, e.g.
# v0.0.1). `workflow_dispatch` allows a manual re-run — dispatched FROM THAT TAG,
# since the version check below applies to it too. The release gate
# (`npm run check`: lint + format + build + corpus + coverage + audit) re-runs in
# the clean CI checkout as its own step, before the npm token is in scope.
#
# Requires the repo secret `NPM_TOKEN` (an npm automation/granular token with
# publish rights to `instagram-mcp-ai`). The MCP-registry submission is a
# separate step (see docs/release-checklist.md) and is not done here.

on:
  release:
    types: [published]
  workflow_dispatch:

# Publishing is not cancellable: a half-run publish cannot be undone, so
# concurrent releases queue instead of superseding each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance attestation (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm rejects a duplicate version, but a tag/version mismatch would
      # silently publish something other than what the release announces — and
      # the git tag is what the changelog and provenance point at. Fail early.
      # Unconditional: a `workflow_dispatch` has no release, so its ref must BE
      # the tag — otherwise a dispatch from any branch would publish that branch
      # as `latest` with no version check at all.
      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi
          echo "Release tag '$RELEASE_TAG' matches package.json."
      - run: npm ci
      # The full gate, as its own step so it runs WITHOUT the npm token. Left to
      # `prepublishOnly` it would run inside the publish step, where every dev
      # dependency and every test child inherits NODE_AUTH_TOKEN.
      - run: npm run check
      # `--ignore-scripts`: the gate already passed above, and re-running it via
      # `prepublishOnly` here would put the token back in its reach. Publishes
      # with provenance (publishConfig.provenance + the id-token permission above).
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
